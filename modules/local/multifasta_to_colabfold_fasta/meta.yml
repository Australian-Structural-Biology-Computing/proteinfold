name: "multifasta_to_colabfold_fasta"
description: Colon-join a sample FASTA into a single-query ColabFold FASTA for the MMseqs2 search.
tools: []
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information.
    - fasta:
        type: file
        description: Multi-FASTA input.
        pattern: "*.{fa,fasta}"
output:
  query_fasta:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*.fasta":
          type: file
          description: Colon-delimited single-record FASTA with the sample id as header.
          pattern: "*.fasta"
  versions_sed:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from.
      - sed:
          type: string
          description: The tool name.
      - 'sed --version 2>&1 | sed "s/^.*GNU sed) //; s/ .*$//"':
          type: eval
          description: The expression to obtain the version of the tool.
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from.
      - sed:
          type: string
          description: The tool name.
      - 'sed --version 2>&1 | sed "s/^.*GNU sed) //; s/ .*$//"':
          type: eval
          description: The expression to obtain the version of the tool.
