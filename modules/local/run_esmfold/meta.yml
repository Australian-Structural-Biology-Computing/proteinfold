name: "run_esmfold"
description: Predict protein structures with ESMFold.
tools: []
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information.
    - fasta:
        type: file
        description: Protein FASTA input.
        pattern: "*.{fa,fasta}"
  - checkpoints:
      type: directory
      description: ESMFold model checkpoint files.
      pattern: "checkpoints/*"
  - numRec:
      type: integer
      description: Number of recycling iterations.
output:
  top_ranked_pdb:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "${meta.id}_esmfold.pdb":
          type: file
          description: Predicted ESMFold structure.
  pdb:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*.pdb":
          type: file
          description: Predicted PDB structure files.
  plddt:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "${meta.id}_plddt.tsv":
          type: file
          description: pLDDT metrics for MultiQC.
  pae:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "${meta.id}_pae.tsv":
          type: file
          description: Predicted aligned error matrix from the same ESMFold inference as the PDB.
  ptm:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "${meta.id}_ptm.tsv":
          type: file
          description: Predicted TM score from the same ESMFold inference as the PDB.
  versions_esmfold:
    - - "${task.process}": { type: string, description: The process the versions were collected from. }
      - esm-fold: { type: string, description: The tool name. }
      - "python3 -m pip show fair-esm | sed -n 's/^Version: //p'":
          { type: eval, description: The installed ESMFold package version. }
  versions_python:
    - - "${task.process}": { type: string, description: The process the versions were collected from. }
      - python: { type: string, description: The tool name. }
      - "python3 --version | sed 's/Python //g'":
          { type: eval, description: The expression to obtain the version of the tool. }
  versions_pytorch:
    - - "${task.process}": { type: string, description: The process the versions were collected from. }
      - pytorch: { type: string, description: The tool name. }
      - 'python3 -c "import torch; print(torch.__version__)" 2>/dev/null || echo "unknown"':
          { type: eval, description: The expression to obtain the version of the tool. }
  versions_openfold:
    - - "${task.process}": { type: string, description: The process the versions were collected from. }
      - openfold: { type: string, description: The tool name. }
      - 'python -m pip show openfold | grep "^Version" | sed ''s/.*Version: //'' 2>/dev/null || echo "unknown"':
          { type: eval, description: The expression to obtain the version of the tool. }
  versions_numpy:
    - - "${task.process}": { type: string, description: The process the versions were collected from. }
      - numpy: { type: string, description: The tool name. }
      - 'python3 -c "import numpy; print(numpy.__version__)" 2>/dev/null || echo "unknown"':
          { type: eval, description: The expression to obtain the version of the tool. }
  versions_biopython:
    - - "${task.process}": { type: string, description: The process the versions were collected from. }
      - biopython: { type: string, description: The tool name. }
      - 'python3 -c "import Bio; print(Bio.__version__)" 2>/dev/null || echo "unknown"':
          { type: eval, description: The expression to obtain the version of the tool. }
