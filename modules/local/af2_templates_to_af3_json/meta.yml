name: "af2_templates_to_af3_json"
description: Add alphafold2 template hits to an AlphaFold3-format MSA JSON
keywords:
  - templates
  - alphafold2
  - alphafold3
  - msa
tools:
  - name: "af2_templates_to_af3_json"
    description: |
      Turns the pdb_seqres/hmmsearch template hits produced by the alphafold2
      data pipeline into alphafold3 folding_input.Template entries and writes
      them into the protein chains of an AlphaFold3-format MSA JSON.
input:
  - meta:
      type: map
      description: Groovy Map containing sample information (id etc.)
  - msa_json:
      type: file
      description: AlphaFold3-format MSA JSON produced by the MSA tooling
  - raw_dir:
      type: directory
      description: RUN_ALPHAFOLD2_MSA raw output bundle (pdb_hits.sto per chain)
  - template_mmcif_dir:
      type: directory
      description: Directory of template mmCIF files (<pdb_id>.cif)
  - obsolete_dat:
      type: file
      description: PDB obsolete.dat entry mapping
  - max_template_date:
      type: string
      description: Latest template release date to keep (YYYY-MM-DD)
output:
  - json:
      type: file
      description: AlphaFold3-format MSA JSON with templates populated
      pattern: "*.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@tom"
