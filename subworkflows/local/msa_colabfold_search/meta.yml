name: "msa_colabfold_search"
description: MMseqs2 (colabfold_search) MSA generation with batching and the MSA cache
input:
  - ch_fasta:
      type: channel
      description: Channel with [meta, fasta] for FASTA-origin samples
  - ch_json:
      type: channel
      description: Channel with [meta, json] for AlphaFold3-JSON-origin samples
output:
  - msa_json:
      type: channel
      description: Channel with [meta, json] AlphaFold3-format MSA JSON per sample
authors:
  - "@tom"
