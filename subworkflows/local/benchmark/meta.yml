name: "BENCHMARK"
description: Benchmark the top-ranked predicted structure of each sample against its reference structure
keywords:
  - benchmarking
  - reference
  - structure
components:
  - benchmark_structure
input:
  - ch_predictions:
      type: channel
      description: |
        Structure of: [path(meta), path(structure)]
        The top-ranked predicted model for each sample.
        Structure of the `meta` map:
          - id: sample id
          - model: name of the prediction mode that produced the model
  - ch_references:
      type: channel
      description: |
        Structure of: [path(id), path(reference)]
        Reference structure for each sample that declares one in the samplesheet.
  - colabfold2_public_mode:
      type: string
      description: Selected ColabFold2 backend mode (e.g. colabfold2-alphafold3), or null when ColabFold2 is not used
  - benchmark_models:
      type: list
      description: Normalized prediction method names expected to emit a top-ranked structure
output:
  - scores:
      type: channel
      description: |
        Structure of: [path(meta), path(benchmark.json)]
        Benchmarking scores of each predicted structure against its reference
  - missing:
      type: channel
      description: |
        Structure of: [val(id), val(model)]
        Referenced sample and method pairs that emitted no top-ranked structure
authors:
  - "@keiran-rowell-unsw"
maintainers:
  - "@keiran-rowell-unsw"
