name: "BENCHMARK"
description: Benchmark the top-ranked predicted structure of each sample against its reference structure
keywords:
  - benchmarking
  - reference
  - structure
components:
  - benchmark_structure
input:
  - ch_predictions:
      type: channel
      description: |
        Structure of: [val(meta), path(structure)]
        The top-ranked predicted model for each sample.
        Structure of the `meta` map:
          - id: sample id
          - model: name of the prediction mode that produced the model
  - ch_references:
      type: channel
      description: |
        Structure of: [val(id), path(reference)]
        Reference structure for each sample that declares one in the samplesheet.
  - colabfold2_public_mode:
      type: string
      description: Selected ColabFold2 backend mode (e.g. colabfold2-alphafold3), or null when ColabFold2 is not used
  - benchmark_models:
      type: list
      description: Normalized prediction method names expected to emit a top-ranked structure
  - benchmark_strict:
      type: boolean
      description: Abort the run when a referenced sample and method pair emits no top-ranked structure, instead of warning
output:
  - scores:
      type: channel
      description: |
        Structure of: [val(meta), path(benchmark.json)]
        Benchmarking scores of each predicted structure against its reference
  - summary:
      type: channel
      description: |
        Structure of: [path(benchmark_summary.csv)]
        CSV summary containing the sample, mode, lDDT, and TM-score for every completed benchmark.
        The file is emitted once per run when at least one prediction is benchmarked and is written
        to `${params.outdir}/benchmark/benchmark_summary.csv`.
  - missing:
      type: channel
      description: |
        Structure of: [val(id), val(model)]
        Referenced sample and method pairs that emitted no top-ranked structure
  - missing_report:
      type: channel
      description: |
        Structure of: [path(benchmark_missing.tsv)]
        Tab-separated report of the missing sample and method pairs, emitted once per run and only
        when at least one referenced prediction is absent. The file carries a `sample`/`method`
        header row and is written to `${params.outdir}/benchmark/benchmark_missing.tsv`.
authors:
  - "@keiran-rowell-unsw"
maintainers:
  - "@keiran-rowell-unsw"
